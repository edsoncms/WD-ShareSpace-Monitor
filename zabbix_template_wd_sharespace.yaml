        - uuid: 3f0cd2f144634884af5a25a640d14f86
          name: 'Temperatura CPU'
          type: HTTP_AGENT
          key: wd.sharespace.temp_cpu
          delay: '120'
          value_type: UNSIGNED
          units: "\xB0C"
          url: 'http://{HOST.CONN}/wd_sharespace_monitor.php?mode=zabbix&metric=temp_cpu'
