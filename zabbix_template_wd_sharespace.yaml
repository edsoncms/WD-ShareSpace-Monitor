zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 851c4142c78f49079c8b4838f375f1d2
      name: Templates/Storage
  templates:
    - uuid: 8809a760cdeb4372897e886171cca686
      template: 'Template WD ShareSpace'
      name: 'Template WD ShareSpace'
      groups:
        - name: Templates/Storage
      items:
        - uuid: f50c7a69ebe34fe0a41b7db30568bb56
          name: Uptime
          type: HTTP_AGENT
          key: wd.sharespace.uptime
          delay: '60'
          value_type: UNSIGNED
          units: s
          url: 'http://{HOST.CONN}/wd_sharespace_monitor.php?mode=zabbix&metric=uptime'
          tags:
            - tag: Application
              value: Sistema
          triggers:
            - uuid: 2cc147c65d0b438f90606d968566fb21
              expression: 'nodata(/Template WD ShareSpace/wd.sharespace.uptime,300)=1'
              name: 'WD ShareSpace: Sem dados por 5 minutos'
              priority: HIGH
              description: 'Storage pode estar offline.'
        - uuid: 65618e92b86e4232880cc27e56d2ced4
          name: 'Load Average (1 min)'
          type: HTTP_AGENT
          key: wd.sharespace.load1
          delay: '60'
          value_type: FLOAT
          url: 'http://{HOST.CONN}/wd_sharespace_monitor.php?mode=zabbix&metric=load1'
          tags:
            - tag: Application
              value: Sistema
          triggers:
            - uuid: cfb4edd20eed4c4b9fe0445e53690a5b
              expression: 'last(/Template WD ShareSpace/wd.sharespace.load1)>4'
              name: 'WD ShareSpace: Load Average alto'
              priority: WARNING
        - uuid: 8d2fee6bb6ff4080a3a64cc376b7a9a5
          name: 'Load Average (5 min)'
          type: HTTP_AGENT
          key: wd.sharespace.load5
